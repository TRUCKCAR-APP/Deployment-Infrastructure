# Validación de la plataforma TruckCar.
#   static     configuración de docker-compose, Prometheus, otel-collector, dashboards y manifiestos de Kubernetes.
#   isolation  levanta el stack completo (9 servicios + infraestructura) con secretos generados y ejecuta
#              scripts/verify-isolation.sh (aislamiento de red) y una prueba de humo de trazas y métricas.
#
# Se ejecuta en este repo y lo reutilizan los repos de los servicios (workflow_call): con service-repo/service-ref el
# servicio que llama se prueba en su commit y el resto en main.
#
# api-gateway y fleets-drivers son privados: clonarlos requiere el secreto TRUCKCAR_REPOS_TOKEN (token de solo lectura
# de contenido sobre los repos de la organización). Sin él, el job isolation se omite con un aviso.
name: Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      service-repo:
        description: Repo del servicio que se prueba en service-ref (el resto, en main)
        type: string
        default: ""
      service-ref:
        description: Commit del servicio
        type: string
        default: ""
    secrets:
      TRUCKCAR_REPOS_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: platform-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  INFRA_REF: ${{ github.repository == 'TRUCKCAR-APP/Deployment-Infrastructure' && github.sha || 'main' }}

jobs:
  static:
    name: Validación estática
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TRUCKCAR-APP/Deployment-Infrastructure
          ref: ${{ env.INFRA_REF }}

      - name: docker-compose (con secretos generados por init-env)
        run: |
          bash scripts/init-env.sh
          docker compose config --quiet
          # Ninguna credencial versionada: compose debe negarse a arrancar sin .env.
          mv .env .env.generated
          if docker compose config --quiet 2>/dev/null; then
            echo "::error::docker-compose.yml resuelve sin .env: hay credenciales con valor por defecto"; exit 1
          fi

      - name: Prometheus (configuración y alertas)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/docker/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml

      - name: OpenTelemetry Collector
        run: |
          docker run --rm -e TRUCKCAR_ENVIRONMENT=ci -v "$PWD/docker/observability:/cfg:ro" \
            otel/opentelemetry-collector-contrib:0.111.0 validate --config=/cfg/otel-collector.yaml

      - name: Dashboards de Grafana
        run: |
          for f in docker/observability/grafana/dashboards/*.json; do
            jq -e '.uid and .title and (.panels | length > 0)' "$f" > /dev/null || { echo "::error file=$f::dashboard inválido"; exit 1; }
          done

      - name: Kubernetes (kustomize + kubeconform)
        run: |
          # db-init usa el mismo script en Docker y en Kubernetes.
          cmp docker/postgres/init-service-schemas.sql k8s/base/data/init-service-schemas.sql
          mkdir -p rendered
          for overlay in aws-eks azure-aks; do
            kubectl kustomize "k8s/overlays/$overlay" > "rendered/$overlay.yaml"
          done
          docker run --rm -v "$PWD/rendered:/work:ro" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary \
            -kubernetes-version 1.30.0 -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /work/aws-eks.yaml /work/azure-aks.yaml

  isolation:
    name: Stack completo y aislamiento de red
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPOS_TOKEN: ${{ secrets.TRUCKCAR_REPOS_TOKEN }}
    steps:
      - name: Token para los repos privados
        id: token
        run: |
          if [ -z "$REPOS_TOKEN" ]; then
            echo "::warning::Falta el secreto TRUCKCAR_REPOS_TOKEN (lectura de api-gateway y fleets-drivers): se omite la prueba del stack completo."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.available == 'true'
        with:
          repository: TRUCKCAR-APP/Deployment-Infrastructure
          ref: ${{ env.INFRA_REF }}

      - name: Clonar los servicios
        if: steps.token.outputs.available == 'true'
        env:
          SERVICE_REPO: ${{ inputs.service-repo }}
          SERVICE_REF: ${{ inputs.service-ref }}
        run: |
          git config --global url."https://x-access-token:${REPOS_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash scripts/clone-repos.sh
          if [ -n "$SERVICE_REPO" ] && [ -n "$SERVICE_REF" ]; then
            git -C "$SERVICE_REPO" fetch --depth 1 origin "$SERVICE_REF"
            git -C "$SERVICE_REPO" checkout --detach FETCH_HEAD
            echo "$SERVICE_REPO en $SERVICE_REF"
          fi

      - name: Levantar la plataforma
        if: steps.token.outputs.available == 'true'
        run: |
          bash scripts/init-env.sh
          docker compose up -d --build
          services="user-identity fleets-drivers community-alerts load-allocation routing-restrictions ai-fleet-allocation route-ai-agent notifications api-gateway"
          for _ in $(seq 1 90); do
            started=0
            for s in $services; do docker compose logs "$s" 2>/dev/null | grep -q "Started .*Application" && started=$((started + 1)); done
            echo "servicios arriba: $started/9"; [ "$started" -eq 9 ] && exit 0
            sleep 5
          done
          echo "::error::la plataforma no arrancó a tiempo"; exit 1

      - name: Aislamiento de red
        if: steps.token.outputs.available == 'true'
        run: bash scripts/verify-isolation.sh

      - name: Métricas y trazas
        if: steps.token.outputs.available == 'true'
        run: |
          up=$(curl -s http://127.0.0.1:9090/api/v1/query --data-urlencode 'query=count(up{job="truckcar-services"} == 1)' | jq -r '.data.result[0].value[1] // 0')
          echo "targets de Prometheus arriba: $up"; [ "$up" -ge 9 ] || { echo "::error::Prometheus no ve los 9 servicios"; exit 1; }
          curl -s -o /dev/null -H "X-Correlation-Id: ci-$GITHUB_RUN_ID" http://localhost:8000/api/v1/loads
          sleep 10
          pw=$(grep '^TRUCKCAR_GRAFANA_ADMIN_PASSWORD=' .env | cut -d= -f2)
          traces=$(curl -s -u "admin:$pw" -G http://127.0.0.1:3000/api/datasources/proxy/uid/tempo/api/search \
            --data-urlencode 'q={ resource.service.name = "ms-api-gateway" }' --data-urlencode limit=5 | jq '.traces | length')
          echo "trazas del gateway en Tempo: $traces"; [ "$traces" -ge 1 ] || { echo "::error::Tempo no recibió trazas"; exit 1; }

      - name: Logs de la plataforma
        if: failure() && steps.token.outputs.available == 'true'
        run: docker compose logs --no-color --tail 200 > platform-logs.txt; tail -n 400 platform-logs.txt

      - uses: actions/upload-artifact@v4
        if: failure() && steps.token.outputs.available == 'true'
        with:
          name: platform-logs
          path: platform-logs.txt
