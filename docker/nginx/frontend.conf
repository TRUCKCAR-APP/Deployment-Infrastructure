# Frontend estático de TruckCar (PWA).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El Service Worker no se cachea por HTTP: el navegador debe ver cada versión nueva para actualizarse.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Manifiesto de la PWA con su tipo MIME (nginx no lo trae en mime.types).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Evidencias de entrega (POD): la PWA sube y descarga con URLs prefirmadas por Load-Allocation. Mismo origen que
    # la app (sin CORS) y el almacenamiento queda sin puertos publicados. La firma S3 cubre la cabecera Host, así que
    # se reenvía el host con el que Load-Allocation firmó (TRUCKCAR_S3_PUBLIC_ENDPOINT).
    location /pod-media/ {
        # Destino en variable + resolvedor de Docker: nginx vuelve a resolver object-storage cada 10 s. Con el nombre
        # fijo lo resolvía una sola vez al arrancar y, si el contenedor se recreaba con otra IP, todas las subidas
        # de evidencias fallaban con 502. Sin URI en proxy_pass se reenvía la ruta original (la firma S3 la cubre).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $object_storage http://object-storage:9000;
        proxy_pass $object_storage;
        proxy_set_header Host localhost:5500;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 6m;
        # Las imágenes no se exponen a otros sitios ni se guardan en cachés intermedias.
        add_header Cache-Control "private, no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
