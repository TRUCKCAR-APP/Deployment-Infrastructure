;; PgBouncer delante de PostgreSQL (truckcar_db). Modo transaction: una conexión de servidor solo se ocupa mientras
;; dura una transacción, así decenas de instancias Spring (pool Hikari de 5 cada una) comparten pocas conexiones reales.
;;
;; Requisitos del modo transaction en los clientes:
;;  * JDBC con prepareThreshold=0 (sin sentencias preparadas del lado del servidor entre transacciones).
;;  * Nada de estado de sesión: el search_path de cada servicio se fija en su rol (ALTER ROLE ... SET search_path),
;;    y los candados de outbox/Flyway son de transacción (pg_try_advisory_xact_lock).

[databases]
truckcar_db = host=postgis port=5432 dbname=truckcar_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction

;; Cada servicio usa su propio rol. Sus contraseñas no se repiten aquí: PgBouncer las consulta en PostgreSQL con
;; auth_user (SCRAM), así que userlist.txt solo contiene el usuario administrador y el de métricas (lo genera el
;; entrypoint a partir de variables de entorno).
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt
auth_user = truckcar_admin
auth_query = SELECT usename, passwd FROM pg_catalog.pg_shadow WHERE usename = $1

max_client_conn = 500
default_pool_size = 8
min_pool_size = 0
reserve_pool_size = 2
reserve_pool_timeout = 3
;; Tope de conexiones reales hacia PostgreSQL (max_connections = 100): queda margen para administración y migraciones.
max_db_connections = 60
server_idle_timeout = 120

;; pgjdbc envía extra_float_digits al conectar; search_path se ignora porque lo fija el rol.
ignore_startup_parameters = extra_float_digits,search_path

admin_users = truckcar_admin
;; pgbouncer_stats solo existe en userlist.txt (no en PostgreSQL): pgbouncer-exporter lo usa para leer SHOW POOLS/STATS
;; en la consola de administración, sin acceso a truckcar_db.
stats_users = pgbouncer_stats
log_connections = 0
log_disconnections = 0
