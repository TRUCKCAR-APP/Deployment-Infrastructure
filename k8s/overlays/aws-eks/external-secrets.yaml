# Secret truckcar-secrets desde AWS Secrets Manager (un secreto por clave: truckcar/jwt-secret, truckcar/db/...).
# Sin claves S3: load-allocation accede al bucket con IRSA.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: truckcar-secrets
  namespace: truckcar
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: truckcar-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: truckcar/jwt-secret
    - secretKey: admin-password
      remoteRef:
        key: truckcar/admin-password
    - secretKey: db-admin-password
      remoteRef:
        key: truckcar/db/admin-password
    - secretKey: db-password-user-identity
      remoteRef:
        key: truckcar/db/user-identity
    - secretKey: db-password-fleets-drivers
      remoteRef:
        key: truckcar/db/fleets-drivers
    - secretKey: db-password-community-alerts
      remoteRef:
        key: truckcar/db/community-alerts
    - secretKey: db-password-load-allocation
      remoteRef:
        key: truckcar/db/load-allocation
    - secretKey: db-password-routing-restrictions
      remoteRef:
        key: truckcar/db/routing-restrictions
    - secretKey: db-password-fleet-allocation
      remoteRef:
        key: truckcar/db/fleet-allocation
    - secretKey: db-password-route-ai-agent
      remoteRef:
        key: truckcar/db/route-ai-agent
    - secretKey: db-password-notifications
      remoteRef:
        key: truckcar/db/notifications
    - secretKey: pgbouncer-stats-password
      remoteRef:
        key: truckcar/pgbouncer/stats-password
    - secretKey: tracking-link-secret
      remoteRef:
        key: truckcar/tracking/link-secret
    - secretKey: rabbitmq-passcode
      remoteRef:
        key: truckcar/rabbitmq/passcode
    - secretKey: azure-openai-key
      remoteRef:
        key: truckcar/azure-openai/key
    - secretKey: notifications-api-key
      remoteRef:
        key: truckcar/notifications/api-key
