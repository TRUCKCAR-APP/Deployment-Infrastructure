# AWS Load Balancer Controller: un ALB con certificado de ACM (el TLS termina en el ALB). WebSocket funciona sobre ALB;
# el idle timeout de 3600 s mantiene abiertas las sesiones de telemetría.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: truckcar
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
spec:
  ingressClassName: alb
