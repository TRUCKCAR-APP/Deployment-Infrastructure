# External Secrets Operator lee AWS Secrets Manager con IRSA: la ServiceAccount del operador tiene un rol IAM con
# secretsmanager:GetSecretValue solo sobre arn:aws:secretsmanager:us-east-1:123456789012:secret:truckcar/*.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
