apiVersion: v1
kind: ConfigMap
metadata:
  name: truckcar-platform
data:
  POSTGRES_HOST: truckcar.cluster-abcd12.us-east-1.rds.amazonaws.com
  SPRING_KAFKA_BOOTSTRAP_SERVERS: b-1.truckcar.abcd12.c2.kafka.us-east-1.amazonaws.com:9092,b-2.truckcar.abcd12.c2.kafka.us-east-1.amazonaws.com:9092
  SPRING_DATA_REDIS_HOST: truckcar.abcd12.ng.0001.use1.cache.amazonaws.com
  TRUCKCAR_STOMP_RELAY_HOST: b-abcd12.mq.us-east-1.amazonaws.com
  # S3 nativo: sin endpoint propio ni credenciales estáticas (IRSA), direcciones virtual-host.
  TRUCKCAR_S3_ENDPOINT: ""
  TRUCKCAR_S3_PUBLIC_ENDPOINT: ""
  TRUCKCAR_STORAGE_S3_PATH_STYLE: "false"
  TRUCKCAR_S3_REGION: us-east-1
  # Trazas a AWS X-Ray a través del ADOT Collector del clúster.
  OTEL_TRACES_ENDPOINT: adot-collector.amazon-cloudwatch:4317
  # api-gateway: solo las subredes públicas donde vive el ALB (target-type ip); cualquier otro origen recibe 403. Valores
  # de ejemplo (subredes públicas por defecto de eksctl): reemplácelos por los CidrBlock de las subredes del ALB.
  TRUCKCAR_GATEWAY_TRUSTED_SOURCE_CIDRS: 192.168.0.0/19,192.168.32.0/19,192.168.64.0/19
