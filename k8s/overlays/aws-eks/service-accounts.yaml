# IRSA: solo load-allocation asume el rol con s3:PutObject, s3:GetObject y s3:HeadObject sobre el bucket de evidencias
# (el webhook de EKS monta su propio token proyectado; el token de la API de Kubernetes sigue sin montarse).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: load-allocation
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/truckcar-load-allocation-pod-media
