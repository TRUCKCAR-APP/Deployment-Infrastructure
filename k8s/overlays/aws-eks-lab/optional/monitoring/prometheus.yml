# Prometheus en el clúster: mismo resultado que docker/observability/prometheus/prometheus.yml (job truckcar-services
# con la etiqueta service, job pgbouncer), pero descubriendo los pods de truckcar por sus anotaciones prometheus.io/*.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: truckcar
    environment: aws-eks-lab

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: truckcar-services
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [truckcar]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      # PgBouncer va en su propio job (como en docker-compose).
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: pgbouncer
        action: drop
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+);(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: pgbouncer
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [truckcar]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: pgbouncer;true
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+);(\d+)
        replacement: $1:$2
        target_label: __address__
      - target_label: service
        replacement: pgbouncer
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          service: prometheus
