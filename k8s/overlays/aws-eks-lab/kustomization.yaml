# AWS Academy Learner Lab (entorno de menos de 30 días) sobre Amazon EKS:
#  - Sin IRSA ni Pod Identity: S3, SNS, Polly y Bedrock usan el LabRole del nodo (DefaultCredentialsProvider).
#  - RDS PostgreSQL gestionado; Kafka, Redis y RabbitMQ con STOMP dentro del clúster sobre EBS gp3.
#  - ALB del AWS Load Balancer Controller con health checks por servicio y reglas de red para su CIDR.
#  - Secret truckcar-secrets creado a mano desde .env (sin External Secrets): ver k8s/README.md.
#  - Tamaño para 2 nodos t3.large (uno por zona): 2 réplicas en la ruta crítica (api-gateway, user-identity,
#    fleets-drivers, pgbouncer y frontend), una en el resto, HPA hasta 3 y requests reducidos.
# Se arma sobre base (no sobre aws-eks): ese overlay supone IRSA, MSK, ElastiCache y Amazon MQ.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# El namespace de base solo cubre los recursos de base: sin esta línea, lo que agrega el overlay (mensajería y reglas de
# red) caería en "default". Los recursos de clúster (StorageClass) no lo reciben.
namespace: truckcar
resources:
  - ../../base
  - storageclass.yaml
  - messaging.yaml
  - network-policies.yaml
patches:
  - path: platform-config.yaml
  - path: service-healthchecks.yaml
  - target:
      kind: Ingress
      name: truckcar
    path: ingress-patch.yaml
  # Imágenes de ECR con la etiqueta móvil "main": con IfNotPresent (el valor por defecto) un nodo que ya tiene una
  # "main" anterior la reutiliza y rollout restart no despliega la nueva. Always solo consulta el digest a ECR (misma
  # región) y descarga si cambió.
  - target:
      kind: Deployment
      name: ^(user-identity|api-gateway|fleets-drivers|community-alerts|load-allocation|routing-restrictions|ai-fleet-allocation|route-ai-agent|notifications|frontend)$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  # La ruta crítica conserva las 2 réplicas de base, una por nodo/zona: si cae un nodo, la otra sigue atendiendo la
  # entrada (api-gateway), el login (user-identity), la telemetría (fleets-drivers), el acceso a la base (pgbouncer) y
  # la PWA (frontend). El resto queda con una réplica: trabaja con eventos de Kafka y, si cae, retoma desde su offset.
  # Sin ADOT ni X-Ray: el collector de trazas no se despliega.
  - target:
      kind: Deployment
      name: otel-collector
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # El HPA no baja de las 2 réplicas de base (minReplicas: 2); el tope se reduce a 3 por la capacidad de los nodos.
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3
  # Servicios Spring: 100m de CPU reservada (2 t3.large tienen ~3,8 vCPU asignables) y memoria acotada.
  - target:
      kind: Deployment
      name: ^(user-identity|api-gateway|fleets-drivers|community-alerts|load-allocation|routing-restrictions|ai-fleet-allocation|route-ai-agent|notifications)$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi

# Imágenes en Amazon ECR (las publica el workflow de CI/CD). 123456789012 se reemplaza por la cuenta del Learner Lab.
images:
  - name: ghcr.io/truckcar-app/api-gateway
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/truckcar/api-gateway
    newTag: main
  - name: ghcr.io/truckcar-app/user-identity
