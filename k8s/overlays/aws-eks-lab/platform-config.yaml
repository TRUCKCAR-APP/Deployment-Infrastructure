# Valores de AWS Academy Learner Lab. Los que dicen REEMPLAZAR se cambian por los de la cuenta antes de aplicar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: truckcar-platform
data:
  # RDS PostgreSQL (con PostGIS); PgBouncer se conecta con TLS.
  POSTGRES_HOST: truckcar-lab.REEMPLAZAR.us-east-1.rds.amazonaws.com
  # Mensajería y caché dentro del clúster (messaging.yaml).
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_DATA_REDIS_HOST: redis
  TRUCKCAR_STOMP_RELAY_HOST: rabbitmq
  # S3 nativo con el LabRole del nodo: sin endpoint propio ni claves (s3-access-key y s3-secret-key no se crean en el
  # Secret; el SDK cae en DefaultCredentialsProvider y lee las credenciales del perfil de instancia).
  TRUCKCAR_S3_BUCKET: truckcar-lab-pod-media-REEMPLAZAR
  TRUCKCAR_S3_REGION: us-east-1
  TRUCKCAR_S3_ENDPOINT: ""
  TRUCKCAR_S3_PUBLIC_ENDPOINT: ""
  TRUCKCAR_STORAGE_S3_PATH_STYLE: "false"
  # Región por defecto del AWS SDK (Notifications: SNS y Polly).
  AWS_REGION: us-east-1
  # Route-AI-agent interpreta las alertas con Azure OpenAI: el Learner Lab no permite Bedrock. El recurso de Azure
  # OpenAI con el despliegue gpt-4.1-mini va en East US 2 o Sweden Central (en East US la cuota de estudiante es 0); la
  # clave va en el Secret (azure-openai-key). Si el modelo falla o limita la tasa, las reglas clasifican la alerta.
  TRUCKCAR_AI_PROVIDER: "azure"
  AZURE_OPENAI_ENDPOINT: https://REEMPLAZAR.openai.azure.com/
  AZURE_OPENAI_DEPLOYMENT: gpt-4.1-mini
  # Sin ADOT ni X-Ray en el Learner Lab: tracing apagado (el collector queda en 0 réplicas). Un endpoint vacío no basta:
  # Spring crea igual el exportador OTLP y el arranque falla con "Invalid endpoint"; null quita la clave de base.
  MANAGEMENT_TRACING_ENABLED: "false"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: null
  TRUCKCAR_TRACING_SAMPLING_PROBABILITY: "0"
  # Origen del navegador: el nombre DNS del ALB (kubectl -n truckcar get ingress truckcar) o el dominio de CloudFront.
  TRUCKCAR_CORS_ALLOWED_ORIGINS: http://REEMPLAZAR.us-east-1.elb.amazonaws.com
  TRUCKCAR_WEBSOCKET_ALLOWED_ORIGINS: http://REEMPLAZAR.us-east-1.elb.amazonaws.com
  TRUCKCAR_PUBLIC_APP_URL: http://REEMPLAZAR.us-east-1.elb.amazonaws.com/
  # api-gateway: solo acepta conexiones TCP cuyo origen esté en estos CIDR (el ALB con target-type ip); el resto recibe
  # 403. Se compara la IP de la conexión, nunca X-Forwarded-For. Por defecto el CIDR de la VPC (el mismo de
  # network-policies.yaml). Para cerrarlo más, ponga solo las subredes del ALB:
  #   aws elbv2 describe-load-balancers --query "LoadBalancers[?starts_with(LoadBalancerName,'k8s-truckcar')].AvailabilityZones[].SubnetId" --output text
  #   aws ec2 describe-subnets --subnet-ids <ids> --query 'Subnets[].CidrBlock' --output text
  # Un CIDR mal escrito impide arrancar el gateway (falla al iniciar, no en silencio).
  TRUCKCAR_GATEWAY_TRUSTED_SOURCE_CIDRS: 192.168.0.0/16
