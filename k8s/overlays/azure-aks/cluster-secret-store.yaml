# External Secrets Operator lee Azure Key Vault con Workload Identity (identidad administrada con el rol
# "Key Vault Secrets User" sobre el vault truckcar-kv).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      vaultUrl: https://truckcar-kv.vault.azure.net
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
