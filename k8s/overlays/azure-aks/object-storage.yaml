# Almacenamiento compatible con S3 para las evidencias de entrega (RustFS en un StatefulSet sobre Azure Disk).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: object-storage
  namespace: truckcar
  labels:
    app.kubernetes.io/name: object-storage
spec:
  serviceName: object-storage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: object-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-storage
        app.kubernetes.io/part-of: truckcar
        truckcar.io/tier: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.4
          env:
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: s3-access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: s3-secret-key
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: s3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: managed-csi-premium
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: object-storage
  namespace: truckcar
  labels:
    app.kubernetes.io/name: object-storage
spec:
  selector:
    app.kubernetes.io/name: object-storage
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
# Llegan al almacenamiento los pods de TruckCar (load-allocation) y el controlador de Ingress (/pod-media).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-object-storage
  namespace: truckcar
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: object-storage
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: truckcar
        - namespaceSelector:
            matchLabels:
              truckcar.io/ingress-controller: "true"
      ports:
        - port: 9000
