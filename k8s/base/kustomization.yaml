# Base común de TruckCar para EKS y AKS. Se despliega con un overlay: kubectl apply -k k8s/overlays/aws-eks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: truckcar
labels:
  - pairs:
      app.kubernetes.io/part-of: truckcar
    includeSelectors: false
resources:
  - namespace.yaml
  - service-accounts.yaml
  - platform-config.yaml
  - data/pgbouncer.yaml
  - data/db-init-job.yaml
  - observability/otel-collector.yaml
  - apps/api-gateway.yaml
  - apps/user-identity.yaml
  - apps/fleets-drivers.yaml
  - apps/community-alerts.yaml
  - apps/load-allocation.yaml
  - apps/routing-restrictions.yaml
  - apps/ai-fleet-allocation.yaml
  - apps/route-ai-agent.yaml
  - apps/notifications.yaml
  - apps/frontend.yaml
  - ingress.yaml
  - network-policies.yaml
  - autoscaling.yaml
# preStop de 10 s en todos los servicios: al terminar un pod (rollout, drenado de nodo, reducción del HPA) el ALB y
# kube-proxy tardan unos segundos en retirarlo de los endpoints. Sin la espera, las peticiones que aún llegan reciben
# 502/503. La acción sleep es nativa de Kubernetes (no requiere shell en la imagen).
patches:
  - target:
      kind: Deployment
      name: ^(user-identity|api-gateway|fleets-drivers|community-alerts|load-allocation|routing-restrictions|ai-fleet-allocation|route-ai-agent|notifications|frontend)$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/lifecycle
        value:
          preStop:
            sleep:
              seconds: 10
configMapGenerator:
  - name: db-init-sql
    files:
      - data/init-service-schemas.sql
images:
  - name: ghcr.io/truckcar-app/api-gateway
    newTag: main
  - name: ghcr.io/truckcar-app/user-identity
    newTag: main
  - name: ghcr.io/truckcar-app/fleets-drivers
    newTag: main
  - name: ghcr.io/truckcar-app/community-alerts
    newTag: main
  - name: ghcr.io/truckcar-app/load-allocation
    newTag: main
  - name: ghcr.io/truckcar-app/routing-restrictions
    newTag: main
  - name: ghcr.io/truckcar-app/ai-fleet-allocation
    newTag: main
  - name: ghcr.io/truckcar-app/route-ai-agent
    newTag: main
  - name: ghcr.io/truckcar-app/notifications
    newTag: main
  - name: ghcr.io/truckcar-app/truckcar-frontend
    newTag: main
