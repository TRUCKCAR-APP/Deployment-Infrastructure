# Una ServiceAccount por componente: los overlays las anotan para IRSA (EKS) o Workload Identity (AKS), de modo que
# solo load-allocation obtiene permisos sobre el bucket de evidencias.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-identity
  labels:
    app.kubernetes.io/name: user-identity
automountServiceAccountToken: false
