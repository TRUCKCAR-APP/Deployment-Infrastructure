# OpenTelemetry Collector: mismo papel que en docker-compose (los servicios solo conocen otel-collector:4318). El
# destino de las trazas lo fija cada overlay en OTEL_TRACES_ENDPOINT (Tempo, AWS X-Ray vía ADOT, Azure Monitor).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch:
        timeout: 2s
        send_batch_size: 1024
      resource:
        attributes:
          - key: deployment.environment
            value: ${env:TRUCKCAR_ENVIRONMENT}
            action: upsert
    exporters:
      otlp:
        endpoint: ${env:OTEL_TRACES_ENDPOINT}
        tls:
          insecure: ${env:OTEL_TRACES_INSECURE}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: truckcar
        truckcar.io/tier: observability
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: TRUCKCAR_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: truckcar-platform
                  key: TRUCKCAR_ENVIRONMENT
            - name: OTEL_TRACES_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: truckcar-platform
                  key: OTEL_TRACES_ENDPOINT
            - name: OTEL_TRACES_INSECURE
              valueFrom:
                configMapKeyRef:
                  name: truckcar-platform
                  key: OTEL_TRACES_INSECURE
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: otlp-grpc
              containerPort: 4317
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
