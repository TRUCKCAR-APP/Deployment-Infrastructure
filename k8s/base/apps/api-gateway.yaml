# api-gateway: único punto de entrada de la API (JWT, CORS, enrutamiento). El actuator escucha en :8090, puerto que el
# Service no expone: el Ingress solo llega a :8000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: truckcar
        truckcar.io/tier: edge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8090"
    spec:
      serviceAccountName: api-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        # Obligatorio: con ScheduleAnyway el scheduler llegó a poner las dos réplicas en el mismo nodo (y si ese nodo
        # cae, el servicio cae). maxSkew 1 deja pasar la réplica extra de un rollout; si se pierde una zona, deja de contar.
        # matchLabelKeys: solo cuenta los pods de la misma revisión. Sin esto, en un rollout las réplicas nuevas se
        # reparten contra las viejas y, al retirarse estas, las nuevas quedan juntas en un nodo.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      containers:
        - name: api-gateway
          image: ghcr.io/truckcar-app/api-gateway
          ports:
            - name: http
              containerPort: 8000
            - name: management
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: truckcar-platform
          env:
            - name: MANAGEMENT_SERVER_PORT
              value: "8090"
            # Perfil prod: CorsConfig no arranca si TRUCKCAR_CORS_ALLOWED_ORIGINS tiene un comodín o localhost (KAN-33).
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: TRUCKCAR_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: jwt-secret
            - name: TRUCKCAR_USER_IDENTITY_URL
              value: "http://user-identity:8080"
            - name: TRUCKCAR_FLEETS_DRIVERS_URL
              value: "lb://fleets-drivers"
            - name: TRUCKCAR_COMMUNITY_ALERTS_URL
              value: "http://community-alerts:8082"
            - name: TRUCKCAR_LOAD_ALLOCATION_URL
              value: "http://load-allocation:8083"
            - name: TRUCKCAR_ROUTING_RESTRICTIONS_URL
              value: "http://routing-restrictions:8084"
            - name: TRUCKCAR_AI_FLEET_ALLOCATION_URL
              value: "http://ai-fleet-allocation:8085"
            - name: TRUCKCAR_ROUTE_AI_AGENT_URL
              value: "http://route-ai-agent:8086"
            - name: TRUCKCAR_NOTIFICATIONS_URL
              value: "http://notifications:8087"
          # Spring Boot activa los grupos de health liveness/readiness al detectar Kubernetes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
