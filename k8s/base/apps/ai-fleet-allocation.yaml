# ai-fleet-allocation: matching de cargas y conductores.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-fleet-allocation
  labels:
    app.kubernetes.io/name: ai-fleet-allocation
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-fleet-allocation
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-fleet-allocation
        app.kubernetes.io/part-of: truckcar
        truckcar.io/tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8085"
    spec:
      serviceAccountName: ai-fleet-allocation
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-fleet-allocation
          image: ghcr.io/truckcar-app/ai-fleet-allocation
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: truckcar-platform
          env:
            - name: SPRING_DATASOURCE_USERNAME
              value: fleet_allocation
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: db-password-fleet-allocation
            - name: TRUCKCAR_SERVICES_LOAD_ALLOCATION_URL
              value: "http://load-allocation:8083"
            - name: TRUCKCAR_SERVICES_FLEETS_DRIVERS_URL
              value: "http://fleets-drivers-api:8081"
            # Gálibo y peso de la ruta de la carga: el motor no propone cargas a camiones que ninguna ruta admite.
            - name: TRUCKCAR_SERVICES_ROUTING_RESTRICTIONS_URL
              value: "http://routing-restrictions:8084"
          # Spring Boot activa los grupos de health liveness/readiness al detectar Kubernetes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-fleet-allocation
  labels:
    app.kubernetes.io/name: ai-fleet-allocation
spec:
  selector:
    app.kubernetes.io/name: ai-fleet-allocation
  ports:
    - name: http
      port: 8085
      targetPort: http
