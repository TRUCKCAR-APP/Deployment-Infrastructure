# route-ai-agent: interpretación de alertas con Azure OpenAI (fallback por reglas).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-ai-agent
  labels:
    app.kubernetes.io/name: route-ai-agent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: route-ai-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: route-ai-agent
        app.kubernetes.io/part-of: truckcar
        truckcar.io/tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8086"
    spec:
      serviceAccountName: route-ai-agent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: route-ai-agent
          image: ghcr.io/truckcar-app/route-ai-agent
          ports:
            - name: http
              containerPort: 8086
          envFrom:
            - configMapRef:
                name: truckcar-platform
          env:
            - name: SPRING_DATASOURCE_USERNAME
              value: route_ai_agent
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: db-password-route-ai-agent
            - name: TRUCKCAR_SERVICES_ALERTS_URL
              value: "http://community-alerts:8082"
            - name: TRUCKCAR_SERVICES_RESTRICTIONS_URL
              value: "http://routing-restrictions:8084"
            - name: AZURE_OPENAI_KEY
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: azure-openai-key
                  optional: true
          # Spring Boot activa los grupos de health liveness/readiness al detectar Kubernetes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: route-ai-agent
  labels:
    app.kubernetes.io/name: route-ai-agent
spec:
  selector:
    app.kubernetes.io/name: route-ai-agent
  ports:
    - name: http
      port: 8086
      targetPort: http
