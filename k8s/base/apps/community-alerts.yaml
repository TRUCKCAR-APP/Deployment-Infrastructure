# community-alerts: alertas viales comunitarias (PostGIS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-alerts
  labels:
    app.kubernetes.io/name: community-alerts
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: community-alerts
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: community-alerts
        app.kubernetes.io/part-of: truckcar
        truckcar.io/tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8082"
    spec:
      serviceAccountName: community-alerts
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: community-alerts
          image: ghcr.io/truckcar-app/community-alerts
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: truckcar-platform
          env:
            - name: SPRING_DATASOURCE_USERNAME
              value: community_alerts
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: db-password-community-alerts
            # SOS sin GPS: se completa con la última posición del conductor en fleets-drivers (llamada interna).
            - name: TRUCKCAR_SERVICES_FLEETS_DRIVERS_URL
              value: "http://fleets-drivers-api:8081"
          # Spring Boot activa los grupos de health liveness/readiness al detectar Kubernetes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: community-alerts
  labels:
    app.kubernetes.io/name: community-alerts
spec:
  selector:
    app.kubernetes.io/name: community-alerts
  ports:
    - name: http
      port: 8082
      targetPort: http
