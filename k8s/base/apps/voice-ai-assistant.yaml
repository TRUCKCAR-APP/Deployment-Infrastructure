# voice-ai-assistant: interpreta con Azure OpenAI las órdenes del Copiloto que el teléfono no entendió. Sin base de
# datos: guarda los últimos turnos de cada conductor en Redis. Sin la clave de Azure responde UNKNOWN y el Copiloto sigue
# con sus reglas locales.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-ai-assistant
  labels:
    app.kubernetes.io/name: voice-ai-assistant
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: voice-ai-assistant
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voice-ai-assistant
        app.kubernetes.io/part-of: truckcar
        truckcar.io/tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8088"
    spec:
      serviceAccountName: voice-ai-assistant
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: voice-ai-assistant
          image: ghcr.io/truckcar-app/voice-ai-assistant
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: truckcar-platform
          env:
            - name: AZURE_OPENAI_KEY
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: azure-openai-key
                  optional: true
          # Spring Boot activa los grupos de health liveness/readiness al detectar Kubernetes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: voice-ai-assistant
  labels:
    app.kubernetes.io/name: voice-ai-assistant
spec:
  selector:
    app.kubernetes.io/name: voice-ai-assistant
  ports:
    - name: http
      port: 8088
      targetPort: http
