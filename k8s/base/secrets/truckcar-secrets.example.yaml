# PLANTILLA: no está en kustomization.yaml ni la aplica ningún overlay. En EKS/AKS el Secret truckcar-secrets lo crea
# External Secrets Operator desde AWS Secrets Manager o Azure Key Vault (overlays/*/external-secrets.yaml).
# Solo para un clúster local (kind/minikube): copiar fuera del repo, completar con valores aleatorios y aplicar a mano.
apiVersion: v1
kind: Secret
metadata:
  name: truckcar-secrets
  namespace: truckcar
type: Opaque
stringData:
  # Base64 de >= 256 bits compartido por User-Identity, api-gateway y Notifications
  jwt-secret: ""
  # ADMIN inicial que crea User-Identity (opcional)
  admin-password: ""
  # usuario administrador de PostgreSQL (solo el Job db-init)
  db-admin-password: ""
  # rol user_identity de PostgreSQL
  db-password-user-identity: ""
  # rol fleets_drivers de PostgreSQL
  db-password-fleets-drivers: ""
  # rol community_alerts de PostgreSQL
  db-password-community-alerts: ""
  # rol load_allocation de PostgreSQL
  db-password-load-allocation: ""
  # rol routing_restrictions de PostgreSQL
  db-password-routing-restrictions: ""
  # rol fleet_allocation de PostgreSQL
  db-password-fleet-allocation: ""
  # rol route_ai_agent de PostgreSQL
  db-password-route-ai-agent: ""
  # rol notifications de PostgreSQL
  db-password-notifications: ""
  # usuario pgbouncer_stats de la consola de PgBouncer
  pgbouncer-stats-password: ""
  # solo almacenamiento compatible con S3 (AKS); en EKS se usa IRSA
  s3-access-key: ""
  # solo almacenamiento compatible con S3 (AKS); en EKS se usa IRSA
  s3-secret-key: ""
  # usuario del relay STOMP de RabbitMQ
  rabbitmq-passcode: ""
  # opcional: sin ella Route-AI-agent interpreta las alertas por reglas
  azure-openai-key: ""
  # opcional: llamadas entre servicios a Notifications
  notifications-api-key: ""
