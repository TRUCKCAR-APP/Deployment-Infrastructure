# Escalan horizontalmente los componentes sin estado de sesión: el gateway, la telemetría (relay STOMP en RabbitMQ y
# Service headless) y la PWA. El PDB mantiene al menos una réplica durante el drenado de nodos.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fleets-drivers
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fleets-drivers
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fleets-drivers
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleets-drivers
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
---
# Login y renovación de tokens: drenar un nodo nunca deja sin réplicas a user-identity.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-identity
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-identity
---
# Todo acceso a la base pasa por PgBouncer: siempre debe quedar una réplica.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
