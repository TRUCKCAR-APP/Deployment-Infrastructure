# PgBouncer (modo transaction) delante de PostgreSQL gestionado (Amazon RDS / Azure Database for PostgreSQL). En los
# servicios gestionados no hay superusuario que lea pg_shadow, así que, a diferencia de docker-compose, no se usa
# auth_query: el initContainer escribe userlist.txt con el rol de cada servicio desde el Secret truckcar-secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer
data:
  pgbouncer.ini: |
    [databases]
    truckcar_db = host=%POSTGRES_HOST% port=5432 dbname=truckcar_db

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    ;; Sin socket Unix: el sistema de archivos es de solo lectura y el exporter entra por TCP (127.0.0.1).
    unix_socket_dir =
    pool_mode = transaction
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer-runtime/userlist.txt
    max_client_conn = 1000
    default_pool_size = 10
    reserve_pool_size = 2
    max_db_connections = 80
    server_idle_timeout = 120
    ignore_startup_parameters = extra_float_digits,search_path
    ;; TLS obligatorio hacia la base gestionada.
    server_tls_sslmode = require
    stats_users = pgbouncer_stats
    log_connections = 0
    log_disconnections = 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels:
    app.kubernetes.io/name: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/part-of: truckcar
        truckcar.io/tier: data
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: pgbouncer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        # Obligatorio: con ScheduleAnyway el scheduler llegó a poner las dos réplicas en el mismo nodo (y si ese nodo
        # cae, el servicio cae). maxSkew 1 deja pasar la réplica extra de un rollout; si se pierde una zona, deja de contar.
        # matchLabelKeys: solo cuenta los pods de la misma revisión. Sin esto, en un rollout las réplicas nuevas se
        # reparten contra las viejas y, al retirarse estas, las nuevas quedan juntas en un nodo.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pgbouncer
      initContainers:
        - name: render-config
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              sed "s/%POSTGRES_HOST%/$POSTGRES_HOST/" /etc/pgbouncer/pgbouncer.ini > /etc/pgbouncer-runtime/pgbouncer.ini
              {
                printf '"%s" "%s"\n' user_identity "$PW_USER_IDENTITY"
                printf '"%s" "%s"\n' fleets_drivers "$PW_FLEETS_DRIVERS"
                printf '"%s" "%s"\n' community_alerts "$PW_COMMUNITY_ALERTS"
                printf '"%s" "%s"\n' load_allocation "$PW_LOAD_ALLOCATION"
                printf '"%s" "%s"\n' routing_restrictions "$PW_ROUTING_RESTRICTIONS"
                printf '"%s" "%s"\n' fleet_allocation "$PW_FLEET_ALLOCATION"
                printf '"%s" "%s"\n' route_ai_agent "$PW_ROUTE_AI_AGENT"
                printf '"%s" "%s"\n' notifications "$PW_NOTIFICATIONS"
                printf '"%s" "%s"\n' pgbouncer_stats "$PW_STATS"
              } > /etc/pgbouncer-runtime/userlist.txt
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: truckcar-platform
                  key: POSTGRES_HOST
            - name: PW_USER_IDENTITY
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: db-password-user-identity
            - name: PW_FLEETS_DRIVERS
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: db-password-fleets-drivers
            - name: PW_COMMUNITY_ALERTS
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: db-password-community-alerts
            - name: PW_LOAD_ALLOCATION
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: db-password-load-allocation
            - name: PW_ROUTING_RESTRICTIONS
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: db-password-routing-restrictions
            - name: PW_FLEET_ALLOCATION
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: db-password-fleet-allocation
            - name: PW_ROUTE_AI_AGENT
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: db-password-route-ai-agent
            - name: PW_NOTIFICATIONS
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: db-password-notifications
            - name: PW_STATS
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: pgbouncer-stats-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: template
              mountPath: /etc/pgbouncer
            - name: runtime
              mountPath: /etc/pgbouncer-runtime
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.24.1-p1
          command: ["pgbouncer", "/etc/pgbouncer-runtime/pgbouncer.ini"]
          ports:
            - name: postgres
              containerPort: 6432
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: runtime
              mountPath: /etc/pgbouncer-runtime
              readOnly: true
        - name: exporter
          image: prometheuscommunity/pgbouncer-exporter:v0.10.2
          args:
            - --pgBouncer.connectionString=postgres://pgbouncer_stats:$(PW_STATS)@127.0.0.1:6432/pgbouncer?sslmode=disable
          env:
            - name: PW_STATS
              valueFrom:
                secretKeyRef:
                  name: truckcar-secrets
                  key: pgbouncer-stats-password
          ports:
            - name: metrics
              containerPort: 9127
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: template
          configMap:
            name: pgbouncer
        - name: runtime
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  labels:
    app.kubernetes.io/name: pgbouncer
spec:
  selector:
    app.kubernetes.io/name: pgbouncer
  ports:
    - name: postgres
      port: 6432
      targetPort: postgres
