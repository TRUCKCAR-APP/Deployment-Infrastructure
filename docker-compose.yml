# =============================================================================
# TruckDar - Plataforma completa en Docker (infraestructura + 9 microservicios + frontend)
#
# Uso:   docker compose up -d --build      (la primera vez compila los 9 servicios, tarda varios minutos)
#        docker compose ps
#        docker compose logs -f api-gateway
#        docker compose down               (agregar -v para borrar los datos)
#
# Aislamiento de red:
#   - Todo corre en la red privada truckdar-network y los servicios se llaman por nombre
#     (http://load-allocation:8083, kafka:29092, postgis:5432...).
#   - Los microservicios NO publican puertos: solo se llega a ellos a través del api-gateway.
#   - Puertos publicados: 8000 (api-gateway) y 5500 (frontend). PostgreSQL, Kafka y Redis
#     solo escuchan en 127.0.0.1 del host, para herramientas de desarrollo y pruebas locales.
#
# Variables (archivo .env junto a este compose, no versionar):
#   TRUCKDAR_JWT_SECRET   obligatoria: Base64 de >= 256 bits, compartida por User-Identity,
#                         api-gateway y Notifications.
#   AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_KEY   opcionales (Route-AI-agent); sin ellas la
#                         interpretación de alertas con IA queda deshabilitada.
#
# No ejecutar a la vez los microservicios con mvnw en el host: compartirían los grupos de
# consumo de Kafka con los contenedores y se repartirían los eventos.
# =============================================================================
name: truckdar

x-spring-service: &spring-service
  restart: unless-stopped
  mem_limit: 768m
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - truckdar-network
  depends_on: &infra-ready
    postgis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully

x-spring-env: &spring-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgis:5432/truckdar_db
  SPRING_DATASOURCE_USERNAME: truckdar_admin
  SPRING_DATASOURCE_PASSWORD: truckdar_password
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  TZ: America/Bogota

services:
  # ===========================================================================
  # Infraestructura
  # ===========================================================================

  # PostgreSQL 16 + PostGIS 3.4: base compartida truckdar_db.
  postgis:
    image: postgis/postgis:16-3.4
    container_name: truckdar-postgis
    environment:
      POSTGRES_DB: truckdar_db
      POSTGRES_USER: truckdar_admin
      POSTGRES_PASSWORD: truckdar_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    networks:
      - truckdar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truckdar_admin -d truckdar_db && psql -U truckdar_admin -d truckdar_db -tAc \"SELECT 1 FROM pg_extension WHERE extname = 'postgis'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Apache Kafka 3.8 en modo KRaft (sin Zookeeper), un solo nodo broker+controller.
  #   - kafka:29092    -> microservicios dentro de truckdar-network
  #   - 127.0.0.1:9092 -> herramientas en el host
  kafka:
    image: apache/kafka:3.8.0
    container_name: truckdar-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    # Sin volumen: los datos de Kafka son efímeros en desarrollo (el outbox reenvía lo pendiente).
    networks:
      - truckdar-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # Crea los tópicos del catálogo una sola vez (idempotente) y termina.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: truckdar-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - truckdar-network
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in \
          truckdar.events.load-allocation \
          truckdar.events.fleet-allocation-results \
          truckdar.events.assignment-notifications \
          truckdar.events.vehicle-status \
          truckdar.events.road-alerts \
          truckdar.events.road-restrictions \
          truckdar.events.route-requests \
          truckdar.events.route-plans \
          truckdar.events.user-events \
          truckdar.notifications.sent \
          truckdar.notifications.failed \
          truckdar.events.load-allocation.DLT \
          truckdar.events.road-restrictions.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        echo "Tópicos TruckDar listos:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  # Redis 7.4: estado de flota en fleets-drivers.
  redis:
    image: redis:7.4-alpine
    container_name: truckdar-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - truckdar-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ===========================================================================
  # Microservicios internos: sin puertos publicados, solo accesibles en truckdar-network.
  # ===========================================================================

  user-identity:
    <<: *spring-service
    build: { context: ./User-Identity, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckdar/user-identity:local
    container_name: truckdar-user-identity
    environment:
      <<: *spring-env
      DB_HOST: postgis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRUCKDAR_JWT_SECRET: ${TRUCKDAR_JWT_SECRET:?Defina TRUCKDAR_JWT_SECRET en .env (Base64 de 256 bits o más)}

  fleets-drivers:
    <<: *spring-service
    build: { context: ./fleets-drivers, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckdar/fleets-drivers:local
    container_name: truckdar-fleets-drivers
    depends_on:
      <<: *infra-ready
      redis:
        condition: service_healthy
    environment:
      <<: *spring-env
      SPRING_DATA_REDIS_HOST: redis
      # Telemetría: verifica con Load-Allocation la propiedad de una carga al suscribirse a /topic/trip/{loadId}.
      TRUCKDAR_SERVICES_LOAD_ALLOCATION_URL: ${TRUCKDAR_LOAD_ALLOCATION_URL:-http://load-allocation:8083}

  community-alerts:
    <<: *spring-service
    build: { context: ./Community-Alerts, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckdar/community-alerts:local
    container_name: truckdar-community-alerts
    environment:
      <<: *spring-env

  load-allocation:
    <<: *spring-service
    build: { context: ./Load-Allocation, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckdar/load-allocation:local
    container_name: truckdar-load-allocation
    environment:
      <<: *spring-env
      TRUCKDAR_ASSIGNMENT_RESPONSE_TIMEOUT_MINUTES: ${TRUCKDAR_ASSIGNMENT_RESPONSE_TIMEOUT_MINUTES:-60}

  routing-restrictions:
    <<: *spring-service
    build: { context: ./Routing-Restrictions, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckdar/routing-restrictions:local
    container_name: truckdar-routing-restrictions
    environment:
      <<: *spring-env

  ai-fleet-allocation:
    <<: *spring-service
    build: { context: ./AI-powered-fleet-allocation, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckdar/ai-fleet-allocation:local
    container_name: truckdar-ai-fleet-allocation
    environment:
      <<: *spring-env
      TRUCKDAR_SERVICES_LOAD_ALLOCATION_URL: ${TRUCKDAR_LOAD_ALLOCATION_URL:-http://load-allocation:8083}
      TRUCKDAR_SERVICES_FLEETS_DRIVERS_URL: ${TRUCKDAR_FLEETS_DRIVERS_URL:-http://fleets-drivers:8081}

  route-ai-agent:
    <<: *spring-service
    build: { context: ./Route-AI-agent, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckdar/route-ai-agent:local
    container_name: truckdar-route-ai-agent
    environment:
      <<: *spring-env
      TRUCKDAR_SERVICES_ALERTS_URL: ${TRUCKDAR_COMMUNITY_ALERTS_URL:-http://community-alerts:8082}
      TRUCKDAR_SERVICES_RESTRICTIONS_URL: ${TRUCKDAR_ROUTING_RESTRICTIONS_URL:-http://routing-restrictions:8084}
      # Se toman del entorno o de .env; nunca se escriben en este archivo.
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-https://example.invalid/}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-sin-configurar}

  notifications:
    <<: *spring-service
    build: { context: ./Notifications, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckdar/notifications:local
    container_name: truckdar-notifications
    environment:
      <<: *spring-env
      SPRING_FLYWAY_URL: jdbc:postgresql://postgis:5432/truckdar_db
      TRUCKDAR_JWT_SECRET: ${TRUCKDAR_JWT_SECRET:?Defina TRUCKDAR_JWT_SECRET en .env (Base64 de 256 bits o más)}
      TRUCKDAR_NOTIFICATIONS_API_KEY: ${TRUCKDAR_NOTIFICATIONS_API_KEY:-}

  # ===========================================================================
  # Puertas de entrada públicas
  # ===========================================================================

  # api-gateway: único punto de acceso a la API (JWT, CORS y enrutamiento por nombre de servicio).
  api-gateway:
    build: { context: ./api-gateway, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckdar/api-gateway:local
    container_name: truckdar-api-gateway
    restart: unless-stopped
    mem_limit: 512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    networks:
      - truckdar-network
    depends_on:
      - user-identity
      - fleets-drivers
      - community-alerts
      - load-allocation
      - routing-restrictions
      - ai-fleet-allocation
      - route-ai-agent
      - notifications
    environment:
      TZ: America/Bogota
      TRUCKDAR_JWT_SECRET: ${TRUCKDAR_JWT_SECRET:?Defina TRUCKDAR_JWT_SECRET en .env (Base64 de 256 bits o más)}
      TRUCKDAR_USER_IDENTITY_URL: ${TRUCKDAR_USER_IDENTITY_URL:-http://user-identity:8080}
      TRUCKDAR_FLEETS_DRIVERS_URL: ${TRUCKDAR_FLEETS_DRIVERS_URL:-http://fleets-drivers:8081}
      TRUCKDAR_COMMUNITY_ALERTS_URL: ${TRUCKDAR_COMMUNITY_ALERTS_URL:-http://community-alerts:8082}
      TRUCKDAR_LOAD_ALLOCATION_URL: ${TRUCKDAR_LOAD_ALLOCATION_URL:-http://load-allocation:8083}
      TRUCKDAR_ROUTING_RESTRICTIONS_URL: ${TRUCKDAR_ROUTING_RESTRICTIONS_URL:-http://routing-restrictions:8084}
      TRUCKDAR_AI_FLEET_ALLOCATION_URL: ${TRUCKDAR_AI_FLEET_ALLOCATION_URL:-http://ai-fleet-allocation:8085}
      TRUCKDAR_ROUTE_AI_AGENT_URL: ${TRUCKDAR_ROUTE_AI_AGENT_URL:-http://route-ai-agent:8086}
      TRUCKDAR_NOTIFICATIONS_URL: ${TRUCKDAR_NOTIFICATIONS_URL:-http://notifications:8087}

  # Frontend estático (repo truckdar-frontend; carpeta configurable con TRUCKDAR_FRONTEND_DIR) en http://localhost:5500.
  # El navegador consume el api-gateway en http://localhost:8000 (ver untitled/js/config.js).
  frontend:
    image: nginx:1.27-alpine
    container_name: truckdar-frontend
    ports:
      - "5500:80"
    volumes:
      - ${TRUCKDAR_FRONTEND_DIR:-./truckdar-frontend}:/usr/share/nginx/html:ro
    networks:
      - truckdar-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  truckdar-network:
    name: truckdar-network
    driver: bridge

volumes:
  postgis_data:
  redis_data:
