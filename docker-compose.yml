# =============================================================================
# TruckCar - Plataforma completa en Docker (infraestructura + 9 microservicios + frontend)
#
# Uso:   docker compose up -d --build      (la primera vez compila los 9 servicios, tarda varios minutos)
#        docker compose ps
#        docker compose logs -f api-gateway
#        docker compose down               (agregar -v para borrar los datos)
#
# Aislamiento de red:
#   - Todo corre en la red privada truckcar-network y los servicios se llaman por nombre
#     (http://load-allocation:8083, kafka:29092, postgis:5432...).
#   - Los microservicios NO publican puertos: solo se llega a ellos a través del api-gateway.
#   - Puertos publicados: 8000 (api-gateway) y 5500 (frontend). PostgreSQL, Kafka y Redis
#     solo escuchan en 127.0.0.1 del host, para herramientas de desarrollo y pruebas locales.
#
# Variables (archivo .env junto a este compose, no versionar):
#   TRUCKCAR_JWT_SECRET   obligatoria: Base64 de >= 256 bits, compartida por User-Identity,
#                         api-gateway y Notifications.
#   AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_KEY   opcionales (Route-AI-agent); sin ellas la
#                         interpretación de alertas usa el fallback por reglas.
#
# No ejecutar a la vez los microservicios con mvnw en el host: compartirían los grupos de
# consumo de Kafka con los contenedores y se repartirían los eventos.
# =============================================================================
name: truckcar

x-spring-service: &spring-service
  restart: unless-stopped
  mem_limit: 768m
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - truckcar-network
  depends_on: &infra-ready
    pgbouncer:
      condition: service_healthy
    db-init:
      condition: service_completed_successfully
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully

x-spring-env: &spring-env
  # Todos los servicios pasan por PgBouncer (modo transaction): prepareThreshold=0 desactiva las sentencias
  # preparadas del lado del servidor, que no sobreviven al cambio de conexión entre transacciones. Cada servicio
  # define su propio SPRING_DATASOURCE_USERNAME/PASSWORD (un rol y un esquema por servicio, ver db-init).
  SPRING_DATASOURCE_URL: jdbc:postgresql://pgbouncer:6432/truckcar_db?prepareThreshold=0
  # 5 conexiones de cliente por instancia; PgBouncer las multiplexa sobre como máximo 60 conexiones reales.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  TZ: America/Bogota

services:
  # ===========================================================================
  # Infraestructura
  # ===========================================================================

  # PostgreSQL 16 + PostGIS 3.4: base compartida truckcar_db.
  postgis:
    image: postgis/postgis:16-3.4
    container_name: truckcar-postgis
    environment:
      POSTGRES_DB: truckcar_db
      POSTGRES_USER: truckcar_admin
      POSTGRES_PASSWORD: truckcar_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    networks:
      - truckcar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truckcar_admin -d truckcar_db && psql -U truckcar_admin -d truckcar_db -tAc \"SELECT 1 FROM pg_extension WHERE extname = 'postgis'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Crea un rol y un esquema por servicio y mueve a cada esquema las tablas que vivían en public (idempotente:
  # corre en cada arranque y termina). Las contraseñas de desarrollo se pueden sobrescribir en .env.
  db-init:
    image: postgis/postgis:16-3.4
    container_name: truckcar-db-init
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - truckcar-network
    environment:
      PGPASSWORD: truckcar_password
    volumes:
      - ./docker/postgres/init-service-schemas.sql:/sql/init-service-schemas.sql:ro
    command:
      - psql
      - --host=postgis
      - --username=truckcar_admin
      - --dbname=truckcar_db
      - --quiet
      - --set=pw_user_identity=${TRUCKCAR_DB_PASSWORD_USER_IDENTITY:-user_identity_dev}
      - --set=pw_load_allocation=${TRUCKCAR_DB_PASSWORD_LOAD_ALLOCATION:-load_allocation_dev}
      - --set=pw_fleets_drivers=${TRUCKCAR_DB_PASSWORD_FLEETS_DRIVERS:-fleets_drivers_dev}
      - --set=pw_community_alerts=${TRUCKCAR_DB_PASSWORD_COMMUNITY_ALERTS:-community_alerts_dev}
      - --set=pw_routing_restrictions=${TRUCKCAR_DB_PASSWORD_ROUTING_RESTRICTIONS:-routing_restrictions_dev}
      - --set=pw_fleet_allocation=${TRUCKCAR_DB_PASSWORD_FLEET_ALLOCATION:-fleet_allocation_dev}
      - --set=pw_route_ai_agent=${TRUCKCAR_DB_PASSWORD_ROUTE_AI_AGENT:-route_ai_agent_dev}
      - --set=pw_notifications=${TRUCKCAR_DB_PASSWORD_NOTIFICATIONS:-notifications_dev}
      - --file=/sql/init-service-schemas.sql
    restart: "no"

  # PgBouncer 1.24 (modo transaction) delante de PostgreSQL: los servicios se conectan a pgbouncer:6432. Solo en
  # truckcar-network; las herramientas del host siguen usando 127.0.0.1:5432.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: truckcar-pgbouncer
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - truckcar-network
    environment:
      PGBOUNCER_AUTH_USER: truckcar_admin
      PGBOUNCER_AUTH_PASSWORD: truckcar_password
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer-truckcar/pgbouncer.ini:ro
    # userlist.txt solo con el usuario de auth_query; las contraseñas de los servicios las resuelve PostgreSQL.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /tmp/pgbouncer
        printf '"%s" "%s"\n' "$$PGBOUNCER_AUTH_USER" "$$PGBOUNCER_AUTH_PASSWORD" > /tmp/pgbouncer/userlist.txt
        exec pgbouncer /etc/pgbouncer-truckcar/pgbouncer.ini
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    restart: unless-stopped

  # Almacenamiento de objetos compatible con S3 (RustFS; las imágenes comunitarias de MinIO ya no se distribuyen):
  # fotos y firmas de la prueba de entrega (POD). Sin puertos publicados: la PWA sube y descarga con URLs
  # prefirmadas por Load-Allocation a través del nginx del frontend (/pod-media/), en su mismo origen y sin CORS.
  # En producción el mismo código apunta a Amazon S3 (TRUCKCAR_S3_ENDPOINT vacío).
  object-storage:
    image: rustfs/rustfs:1.0.4
    container_name: truckcar-object-storage
    environment:
      RUSTFS_ACCESS_KEY: ${TRUCKCAR_S3_ACCESS_KEY:-truckcar}
      RUSTFS_SECRET_KEY: ${TRUCKCAR_S3_SECRET_KEY:-truckcar_s3_dev_secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_VOLUMES: /data
    volumes:
      - object_storage_data:/data
    networks:
      - truckcar-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  # Apache Kafka 3.8 en modo KRaft (sin Zookeeper), un solo nodo broker+controller.
  #   - kafka:29092    -> microservicios dentro de truckcar-network
  #   - 127.0.0.1:9092 -> herramientas en el host
  kafka:
    image: apache/kafka:3.8.0
    container_name: truckcar-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    # Sin volumen: los datos de Kafka son efímeros en desarrollo (el outbox reenvía lo pendiente).
    networks:
      - truckcar-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # Crea los tópicos del catálogo una sola vez (idempotente) y termina.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: truckcar-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - truckcar-network
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in \
          truckcar.events.load-allocation \
          truckcar.events.fleet-allocation-results \
          truckcar.events.assignment-notifications \
          truckcar.events.vehicle-status \
          truckcar.events.road-alerts \
          truckcar.events.road-restrictions \
          truckcar.events.route-requests \
          truckcar.events.route-plans \
          truckcar.events.user-events \
          truckcar.notifications.sent \
          truckcar.notifications.failed \
          truckcar.events.load-allocation.DLT \
          truckcar.events.road-restrictions.DLT \
          truckcar.events.road-alerts.DLT \
          truckcar.events.route-requests.DLT \
          truckcar.events.vehicle-status.DLT \
          truckcar.events.fleet-allocation-results.DLT \
          truckcar.events.assignment-notifications.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        echo "Tópicos TruckCar listos:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  # Redis 7.4: estado de flota en fleets-drivers.
  redis:
    image: redis:7.4-alpine
    container_name: truckcar-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - truckcar-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # RabbitMQ 3.13 con el plugin STOMP: broker externo de la telemetría en vivo de fleets-drivers. Desacopla las
  # suscripciones WebSocket del proceso Spring, de modo que fleets-drivers admite varias réplicas
  # (docker compose up -d --scale fleets-drivers=2). Sin puertos publicados.
  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: truckcar-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${TRUCKCAR_STOMP_RELAY_LOGIN:-truckcar}
      RABBITMQ_DEFAULT_PASS: ${TRUCKCAR_STOMP_RELAY_PASSCODE:-truckcar_stomp}
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_stomp && exec docker-entrypoint.sh rabbitmq-server"]
    networks:
      - truckcar-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    mem_limit: 384m
    restart: unless-stopped

  # ===========================================================================
  # Microservicios internos: sin puertos publicados, solo accesibles en truckcar-network.
  # ===========================================================================

  user-identity:
    <<: *spring-service
    build: { context: ./User-Identity, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckcar/user-identity:local
    container_name: truckcar-user-identity
    environment:
      <<: *spring-env
      # Rol propio: dueño solo del esquema user_identity (ver docker/postgres/init-service-schemas.sql).
      SPRING_DATASOURCE_USERNAME: user_identity
      SPRING_DATASOURCE_PASSWORD: ${TRUCKCAR_DB_PASSWORD_USER_IDENTITY:-user_identity_dev}
      DB_HOST: postgis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRUCKCAR_JWT_SECRET: ${TRUCKCAR_JWT_SECRET:?Defina TRUCKCAR_JWT_SECRET en .env (Base64 de 256 bits o más)}
      # ADMIN inicial (AdminBootstrap): solo se crea si no existe ningún ADMIN.
      TRUCKCAR_ADMIN_EMAIL: ${TRUCKCAR_ADMIN_EMAIL:-}
      TRUCKCAR_ADMIN_PASSWORD: ${TRUCKCAR_ADMIN_PASSWORD:-}

  fleets-drivers:
    <<: *spring-service
    build: { context: ./fleets-drivers, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckcar/fleets-drivers:local
    # Sin container_name: el servicio se puede escalar (--scale fleets-drivers=N); el DNS de Docker reparte
    # http://fleets-drivers:8081 entre las réplicas y RabbitMQ entrega la telemetría a todas.
    depends_on:
      <<: *infra-ready
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *spring-env
      # Rol propio: dueño solo del esquema fleets_drivers (ver docker/postgres/init-service-schemas.sql).
      SPRING_DATASOURCE_USERNAME: fleets_drivers
      SPRING_DATASOURCE_PASSWORD: ${TRUCKCAR_DB_PASSWORD_FLEETS_DRIVERS:-fleets_drivers_dev}
      SPRING_DATA_REDIS_HOST: redis
      # Telemetría: verifica con Load-Allocation la propiedad de una carga al suscribirse a /topic/trip.{loadId}.
      TRUCKCAR_SERVICES_LOAD_ALLOCATION_URL: ${TRUCKCAR_LOAD_ALLOCATION_URL:-http://load-allocation:8083}
      TRUCKCAR_STOMP_RELAY_ENABLED: "true"
      TRUCKCAR_STOMP_RELAY_HOST: rabbitmq
      TRUCKCAR_STOMP_RELAY_LOGIN: ${TRUCKCAR_STOMP_RELAY_LOGIN:-truckcar}
      TRUCKCAR_STOMP_RELAY_PASSCODE: ${TRUCKCAR_STOMP_RELAY_PASSCODE:-truckcar_stomp}

  community-alerts:
    <<: *spring-service
    build: { context: ./Community-Alerts, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckcar/community-alerts:local
    container_name: truckcar-community-alerts
    environment:
      <<: *spring-env
      # Rol propio: dueño solo del esquema community_alerts (ver docker/postgres/init-service-schemas.sql).
      SPRING_DATASOURCE_USERNAME: community_alerts
      SPRING_DATASOURCE_PASSWORD: ${TRUCKCAR_DB_PASSWORD_COMMUNITY_ALERTS:-community_alerts_dev}

  load-allocation:
    <<: *spring-service
    build: { context: ./Load-Allocation, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckcar/load-allocation:local
    container_name: truckcar-load-allocation
    depends_on:
      <<: *infra-ready
      # La migración V3 traslada las evidencias Base64 al almacenamiento de objetos.
      object-storage:
        condition: service_healthy
    environment:
      <<: *spring-env
      # Rol propio: dueño solo del esquema load_allocation (ver docker/postgres/init-service-schemas.sql).
      SPRING_DATASOURCE_USERNAME: load_allocation
      SPRING_DATASOURCE_PASSWORD: ${TRUCKCAR_DB_PASSWORD_LOAD_ALLOCATION:-load_allocation_dev}
      TRUCKCAR_ASSIGNMENT_RESPONSE_TIMEOUT_MINUTES: ${TRUCKCAR_ASSIGNMENT_RESPONSE_TIMEOUT_MINUTES:-60}
      # Evidencias de entrega: API S3 interna y dirección pública con la que se firman las URLs de la PWA.
      TRUCKCAR_S3_ENDPOINT: http://object-storage:9000
      TRUCKCAR_S3_PUBLIC_ENDPOINT: ${TRUCKCAR_S3_PUBLIC_ENDPOINT:-http://localhost:5500}
      TRUCKCAR_S3_ACCESS_KEY: ${TRUCKCAR_S3_ACCESS_KEY:-truckcar}
      TRUCKCAR_S3_SECRET_KEY: ${TRUCKCAR_S3_SECRET_KEY:-truckcar_s3_dev_secret}

  routing-restrictions:
    <<: *spring-service
    build: { context: ./Routing-Restrictions, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckcar/routing-restrictions:local
    container_name: truckcar-routing-restrictions
    environment:
      <<: *spring-env
      # Rol propio: dueño solo del esquema routing_restrictions (ver docker/postgres/init-service-schemas.sql).
      SPRING_DATASOURCE_USERNAME: routing_restrictions
      SPRING_DATASOURCE_PASSWORD: ${TRUCKCAR_DB_PASSWORD_ROUTING_RESTRICTIONS:-routing_restrictions_dev}

  ai-fleet-allocation:
    <<: *spring-service
    build: { context: ./AI-powered-fleet-allocation, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckcar/ai-fleet-allocation:local
    container_name: truckcar-ai-fleet-allocation
    environment:
      <<: *spring-env
      # Rol propio: dueño solo del esquema fleet_allocation (ver docker/postgres/init-service-schemas.sql).
      SPRING_DATASOURCE_USERNAME: fleet_allocation
      SPRING_DATASOURCE_PASSWORD: ${TRUCKCAR_DB_PASSWORD_FLEET_ALLOCATION:-fleet_allocation_dev}
      TRUCKCAR_SERVICES_LOAD_ALLOCATION_URL: ${TRUCKCAR_LOAD_ALLOCATION_URL:-http://load-allocation:8083}
      TRUCKCAR_SERVICES_FLEETS_DRIVERS_URL: ${TRUCKCAR_FLEETS_DRIVERS_URL:-http://fleets-drivers:8081}

  route-ai-agent:
    <<: *spring-service
    build: { context: ./Route-AI-agent, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckcar/route-ai-agent:local
    container_name: truckcar-route-ai-agent
    environment:
      <<: *spring-env
      # Rol propio: dueño solo del esquema route_ai_agent (ver docker/postgres/init-service-schemas.sql).
      SPRING_DATASOURCE_USERNAME: route_ai_agent
      SPRING_DATASOURCE_PASSWORD: ${TRUCKCAR_DB_PASSWORD_ROUTE_AI_AGENT:-route_ai_agent_dev}
      TRUCKCAR_SERVICES_ALERTS_URL: ${TRUCKCAR_COMMUNITY_ALERTS_URL:-http://community-alerts:8082}
      TRUCKCAR_SERVICES_RESTRICTIONS_URL: ${TRUCKCAR_ROUTING_RESTRICTIONS_URL:-http://routing-restrictions:8084}
      # Se toman del entorno o de .env; nunca se escriben en este archivo.
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-https://example.invalid/}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-sin-configurar}

  notifications:
    <<: *spring-service
    build: { context: ./Notifications, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckcar/notifications:local
    container_name: truckcar-notifications
    environment:
      <<: *spring-env
      # Rol propio: dueño solo del esquema notifications (ver docker/postgres/init-service-schemas.sql).
      SPRING_DATASOURCE_USERNAME: notifications
      SPRING_DATASOURCE_PASSWORD: ${TRUCKCAR_DB_PASSWORD_NOTIFICATIONS:-notifications_dev}
      TRUCKCAR_JWT_SECRET: ${TRUCKCAR_JWT_SECRET:?Defina TRUCKCAR_JWT_SECRET en .env (Base64 de 256 bits o más)}
      TRUCKCAR_NOTIFICATIONS_API_KEY: ${TRUCKCAR_NOTIFICATIONS_API_KEY:-}

  # ===========================================================================
  # Puertas de entrada públicas
  # ===========================================================================

  # api-gateway: único punto de acceso a la API (JWT, CORS y enrutamiento por nombre de servicio).
  api-gateway:
    build: { context: ./api-gateway, dockerfile: ../docker/spring-service.Dockerfile }
    image: truckcar/api-gateway:local
    container_name: truckcar-api-gateway
    restart: unless-stopped
    mem_limit: 512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    networks:
      - truckcar-network
    depends_on:
      - user-identity
      - fleets-drivers
      - community-alerts
      - load-allocation
      - routing-restrictions
      - ai-fleet-allocation
      - route-ai-agent
      - notifications
    environment:
      TZ: America/Bogota
      TRUCKCAR_JWT_SECRET: ${TRUCKCAR_JWT_SECRET:?Defina TRUCKCAR_JWT_SECRET en .env (Base64 de 256 bits o más)}
      TRUCKCAR_USER_IDENTITY_URL: ${TRUCKCAR_USER_IDENTITY_URL:-http://user-identity:8080}
      # lb://: el gateway reparte peticiones y conexiones WebSocket entre todas las réplicas de fleets-drivers
      # (las IP salen del DNS de Docker). Para depurar desde el IDE se sigue pudiendo pasar una URL http://.
      TRUCKCAR_FLEETS_DRIVERS_URL: ${TRUCKCAR_FLEETS_DRIVERS_URL:-lb://fleets-drivers}
      TRUCKCAR_COMMUNITY_ALERTS_URL: ${TRUCKCAR_COMMUNITY_ALERTS_URL:-http://community-alerts:8082}
      TRUCKCAR_LOAD_ALLOCATION_URL: ${TRUCKCAR_LOAD_ALLOCATION_URL:-http://load-allocation:8083}
      TRUCKCAR_ROUTING_RESTRICTIONS_URL: ${TRUCKCAR_ROUTING_RESTRICTIONS_URL:-http://routing-restrictions:8084}
      TRUCKCAR_AI_FLEET_ALLOCATION_URL: ${TRUCKCAR_AI_FLEET_ALLOCATION_URL:-http://ai-fleet-allocation:8085}
      TRUCKCAR_ROUTE_AI_AGENT_URL: ${TRUCKCAR_ROUTE_AI_AGENT_URL:-http://route-ai-agent:8086}
      TRUCKCAR_NOTIFICATIONS_URL: ${TRUCKCAR_NOTIFICATIONS_URL:-http://notifications:8087}

  # Frontend estático (repo truckcar-frontend; carpeta configurable con TRUCKCAR_FRONTEND_DIR) en http://localhost:5500.
  # El navegador consume el api-gateway en http://localhost:8000 (ver untitled/js/config.js).
  frontend:
    image: nginx:1.27-alpine
    container_name: truckcar-frontend
    ports:
      - "5500:80"
    volumes:
      - ${TRUCKCAR_FRONTEND_DIR:-./truckcar-frontend}:/usr/share/nginx/html:ro
      # Service Worker sin caché HTTP y proxy /pod-media/ hacia el almacenamiento de objetos (URLs prefirmadas).
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      object-storage:
        condition: service_healthy
    networks:
      - truckcar-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  truckcar-network:
    name: truckcar-network
    driver: bridge

volumes:
  postgis_data:
  redis_data:
  object_storage_data:
